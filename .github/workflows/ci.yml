name: CI

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Chrome for browser regression
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Syntax check
        run: |
          node --check src/server.js
          node --check src/worker.mjs
          node --check src/services/objectStorage.js
          node --check src/http/middleware.js
          node --check src/infra/logger.js
          node --check src/infra/metrics.js
          node --check scripts/ops-backup-restore-drill.mjs

      - name: Unit and integration tests
        run: npm test

      - name: Documentation checks
        run: npm run docs:check

      - name: Cloudflare Worker smoke
        run: npm run cf:smoke

      - name: Cloudflare Worker syntax check
        run: npm run cf:check

      - name: UI quality gates
        run: npm run ui:check

      - name: Browser matrix, accessibility, keyboard and end-to-end regression
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run ui:browser

      - name: Extension syntax and Safari parity
        run: npm run extension:check

      - name: Build and smoke test production Docker image
        run: |
          docker build -t rainbow-audit:ci .
          docker run -d --name rainbow-audit-ci -p 13789:3789 rainbow-audit:ci
          trap 'docker logs rainbow-audit-ci; docker rm -f rainbow-audit-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:13789/api/health; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Upload browser screenshots and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-audit-${{ github.run_id }}
          path: docs/screenshots/audit-2026-11-16/after/
          if-no-files-found: warn

      - name: Operations drill
        run: npm run ops:drill
